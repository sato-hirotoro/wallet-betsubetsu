spring.application.name=SEPANT

# ===== DB（MySQL）=====
# スキーマ・ユーザーは db/setup.sql で作成する（DB設計書 2章・7章・8章）
spring.datasource.url=jdbc:mysql://localhost:3306/sepant?serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=${SEPANT_DB_USER:sepant_app}
spring.datasource.password=${SEPANT_DB_PASSWORD:sepant_app_pw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== メッセージ =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

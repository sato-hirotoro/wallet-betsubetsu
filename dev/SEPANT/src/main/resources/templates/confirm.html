<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SEPANT</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ===== ヘッダー ===== -->
<header class="header header--title">
    <h1 class="header__title" th:text="|精算確認 ${@ymFormatter.display(ym)}|">精算確認 2026.6</h1>
</header>

<form method="post" th:action="@{/seisan}">
<input type="hidden" name="ym" th:value="${ym}">

<main class="main">
    <section class="summary">
        <p class="summary__direction" th:text="${result.direction.label}">夫◀妻</p>
        <p class="summary__amount" th:text="${@amountFormatter.format(result.amount)}">¥26,049</p>
    </section>
    <p th:text="${confirmMessage}">夫◀妻 26,049円精算済にします。よろしいですか。</p>
    <p class="message message--warning">精算済にすると、この月の支払いは修正できません。</p>
</main>

<!-- ===== フッター ===== -->
<footer class="footer footer--split">
    <a class="btn btn--secondary" th:href="@{/result(ym=${ym})}">戻る</a>
    <button type="submit" class="btn btn--primary">精算済にする</button>
</footer>

</form>

</body>
</html>
